{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mongodb-chart.fullname" . }}-backups
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb-chart.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  {{- with .Values.backup.storage.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  accessModes:
    {{- toYaml .Values.backup.storage.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
{{- end }}