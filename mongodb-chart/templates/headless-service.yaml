apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongodb-chart.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mongodb-chart.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "mongodb-chart.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mongodb
      port: {{ .Values.service.port }}
      targetPort: mongodb
      protocol: TCP
