{{- if .Values.restore.enabled }}
{{- $archive := required "restore.archiveFile muss der Name einer vorhandenen Backup-Datei sein" .Values.restore.archiveFile }}
{{- if and .Values.restore.database .Values.restore.fullRestore }}
{{- fail "Setze restore.database oder restore.fullRestore, nicht beides" }}
{{- end }}
{{- if and (not .Values.restore.database) (not .Values.restore.fullRestore) }}
{{- fail "Für einen Restore muss restore.database gesetzt oder restore.fullRestore=true sein" }}
{{- end }}
{{- if or (contains "/" $archive) (contains ".." $archive) }}
{{- fail "restore.archiveFile darf nur ein Dateiname ohne Pfad sein" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mongodb-chart.fullname" . }}-restore
  namespace: {{ .Release.Namespace }}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: restore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.usernameKey }}
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.passwordKey }}
          command:
            - sh
            - -ec
            - |
              archive="/backups/{{ $archive }}"
              if [ ! -f "$archive" ]; then
                echo "Backup-Datei nicht gefunden: $archive"
                exit 1
              fi

              mongodb_uri="mongodb://{{ include "mongodb-chart.memberHosts" . }}/?replicaSet={{ .Values.replicaSet.name }}&tls=true&tlsCAFile=/tls/ca.crt"

              {{ if not .Values.restore.fullRestore }}
              mongorestore --uri="$mongodb_uri" \
                --username="$MONGO_USERNAME" \
                --password="$MONGO_PASSWORD" \
                --authenticationDatabase=admin \
                --nsInclude="{{ .Values.restore.database }}.*" \
                --drop \
                --archive="$archive" \
                --gzip
              {{ else }}
              mongorestore --uri="$mongodb_uri" \
                --username="$MONGO_USERNAME" \
                --password="$MONGO_PASSWORD" \
                --authenticationDatabase=admin \
                --drop \
                --oplogReplay \
                --archive="$archive" \
                --gzip
              {{ end }}

              echo "Wiederherstellung abgeschlossen: $archive"
          volumeMounts:
            - name: backup-data
              mountPath: /backups
              readOnly: true
            - name: tls-ca
              mountPath: /tls
              readOnly: true
      volumes:
        - name: backup-data
          persistentVolumeClaim:
            claimName: {{ include "mongodb-chart.fullname" . }}-backups
        - name: tls-ca
          secret:
            secretName: {{ index .Values.tls.memberSecrets "mongodb-0" }}
            items:
              - key: ca.crt
                path: ca.crt
{{- end }}
